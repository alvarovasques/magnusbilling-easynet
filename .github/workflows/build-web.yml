name: build-web
# Builda o SPA (pasta web/) numa imagem nginx e publica no GHCR.
# Pacote novo (easynet-web) -> pertence a este repo, sem erro de permissão.
on:
  push:
    branches: [ "source" ]
    paths: [ "web/**" ]
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/easynet-web:latest
            ghcr.io/${{ github.repository_owner }}/easynet-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger Portainer redeploy (opcional)
        if: ${{ success() }}
        run: |
          if [ -n "${{ secrets.PORTAINER_WEBHOOK_URL }}" ]; then
            curl -fsS -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}" || echo "webhook falhou (ok, atualize manual)";
          else echo "sem PORTAINER_WEBHOOK_URL; atualize a stack no Portainer."; fi
